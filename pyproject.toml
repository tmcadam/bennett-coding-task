[project]
name = "bennett-coding-task"
version = "0.1.0"
description = "A coding assessment for RSE role at Bennett Institute"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.14"
strict = true
# Exclude the entire tests directory and any files starting with test_
exclude = [
    '^tests/',
    '^tmp/',
    'test_.*\.py$'
]
